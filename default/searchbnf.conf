[aiguy-command]
syntax = aiguy (prompt=<string>)? (mode=<string>)? (field=<string>)? (value=<string>)? (new_field_name=<string>)?
shortdesc = Ask AI about your query results.
description = Sends a sample of upstream results to an LLM and adds AI-generated fields. \
    Supports analysis (prompt/mode), extraction (mode=extract), enrichment (mode=enrich), \
    SPL explanation (mode=explain), and follow-up suggestions (mode=suggest).
usage = public
example1 = | aiguy prompt="which host is busiest?"
comment1 = Free-form question about the data.
example2 = | aiguy mode="summary"
comment2 = Preset analysis mode.
example3 = | aiguy mode="enrich" field="status" prompt="classify as success or failure"
comment3 = Per-row AI labeling with caching.
example4 = | aiguy mode="extract" field="email" prompt="extract the domain" new_field_name="domain"
comment4 = AI-powered field extraction (regex + dict fallback).
example5 = | aiguy mode="explain"
comment5 = Explain the SPL query in plain English.
tags = ai llm analyze enrich extract

[aiguy-options]
syntax = prompt=<string> | mode=<string> | field=<string> | value=<string> | new_field_name=<string>
description = Options for the aiguy command.

[aiguy-mode]
syntax = mode=(summary|anomaly|trend|compare|alert|health|top|extract|enrich|explain|suggest)
description = Preset analysis mode. Each mode uses a specialized prompt.
